<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaneberg - Analyses & Exploration de Dune</title>
    <meta name="description" content="Analyses approfondies, parallélismes historiques et lore de l'univers de Dune.">

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/transitions.css">

    <!-- Script Anti-FOUC : exécution synchrone dans le head pour empêcher le flash de thème -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('kaneberg-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <img src="images/Copie de Copie de VS (40).png" alt="Kaneberg Logo" class="site-logo" width="40" height="40">
                <span class="site-title">Kaneberg</span>
            </a>
            
            <nav class="main-nav">
                <a href="index.html" class="active">Accueil</a>
                <a href="articles.html">Articles</a>
                <a href="favoris.html">Favoris</a>
                <a href="about.html">À propos</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="header-actions">
                <button id="theme-toggle" aria-label="Changer de thème" class="theme-btn">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="hero">
            <h1>Analyses & Lore de Dune</h1>
            <p>Décryptages historiques, réflexions philosophiques et exploration de l'univers de Frank Herbert.</p>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Rechercher un article, un thème..." aria-label="Rechercher">
            </div>
        </section>

        <section class="articles-section">
            <div id="articles-grid" class="articles-grid">
                <!-- Injection dynamique des articles -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Kaneberg. Tous droits réservés.</p>
    </footer>

    <!-- Logique JavaScript globale différée -->
    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Toggle du thème clair / sombre sans détection automatique
            const themeBtn = document.getElementById('theme-toggle');
            themeBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('kaneberg-theme', newTheme);
            });

            // 2. Chargement et rendu optimisé des articles
            const articlesGrid = document.getElementById('articles-grid');
            const searchInput = document.getElementById('search-input');
            let allArticles = [];

            async function loadArticles() {
                try {
                    const response = await fetch('articles.json');
                    allArticles = await response.json();
                    renderArticles(allArticles);
                } catch (error) {
                    articlesGrid.innerHTML = '<p class="error">Erreur lors du chargement des analyses.</p>';
                }
            }

            function renderArticles(articles) {
                articlesGrid.innerHTML = '';
                if (articles.length === 0) {
                    articlesGrid.innerHTML = '<p class="no-results">Aucun résultat trouvé.</p>';
                    return;
                }

                // Optimisation de rendu : utilisation d'un Fragment pour éviter les reflows répétés
                const fragment = document.createDocumentFragment();

                articles.forEach(article => {
                    const card = document.createElement('article');
                    card.className = 'article-card';
                    card.innerHTML = `
                        <a href="${article.url || '#'}" class="card-link">
                            <div class="card-image-wrapper">
                                <img src="${article.image || 'images/default.png'}" alt="${article.title}" loading="lazy" width="400" height="225">
                            </div>
                            <div class="card-content">
                                <span class="card-category">${article.category || 'Analyse'}</span>
                                <h2 class="card-title">${article.title}</h2>
                                <p class="card-excerpt">${article.excerpt || ''}</p>
                                <span class="card-date">${article.date || ''}</span>
                            </div>
                        </a>
                    `;
                    fragment.appendChild(card);
                });

                articlesGrid.appendChild(fragment);
            }

            // 3. Filtrage en temps réel
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase().trim();
                    const filtered = allArticles.filter(art => 
                        art.title.toLowerCase().includes(query) || 
                        (art.excerpt && art.excerpt.toLowerCase().includes(query))
                    );
                    renderArticles(filtered);
                });
            }

            loadArticles();
        });
    </script>
</body>
</html>
